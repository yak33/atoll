<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景:深邃黑曜石渐变 -->
    <radialGradient id="bg" cx="50%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#22232c"/>
      <stop offset="50%" stop-color="#111217"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>

    <!-- 环礁泻湖青绿渐变:晴空青蓝 -> 薄荷翠绿 -->
    <linearGradient id="lagoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- 胶囊外壳深色渐变 -->
    <linearGradient id="pillShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2f36"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>

    <!-- 同心环礁涟漪渐变 -->
    <linearGradient id="rippleRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- 圆角外框 -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="228" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="8"/>

  <!-- 环礁同心涟漪 (外层) -->
  <rect x="132" y="272" width="760" height="480" rx="240" fill="none" stroke="url(#rippleRing)" stroke-width="14" opacity="0.45"/>
  <!-- 环礁同心涟漪 (内层) -->
  <rect x="192" y="322" width="640" height="380" rx="190" fill="none" stroke="url(#rippleRing)" stroke-width="12" opacity="0.8"/>

  <!-- 灵动岛核心胶囊 (更大的占比,确保小尺寸托盘极其锐利) -->
  <rect x="242" y="372" width="540" height="280" rx="140" fill="url(#pillShell)"/>
  <rect x="242" y="372" width="540" height="280" rx="140" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="6"/>
  <rect x="245" y="375" width="534" height="274" rx="137" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>

  <!-- 胶囊内嵌泻湖进度槽 -->
  <rect x="302" y="447" width="420" height="130" rx="65" fill="#08080a"/>
  <!-- 翡翠青蓝进度条(填充约 68%) -->
  <rect x="307" y="452" width="288" height="120" rx="60" fill="url(#lagoon)"/>
  
  <!-- 进度条末端高光游标白点 + 环礁光晕 -->
  <circle cx="595" cy="512" r="32" fill="#ffffff"/>
  <circle cx="595" cy="512" r="46" fill="none" stroke="#2dd4bf" stroke-width="8" opacity="0.75"/>

  <!-- 胶囊顶部玻璃高光丝 -->
  <path d="M 360 388 L 664 388" stroke="rgba(255,255,255,0.45)" stroke-width="5" stroke-linecap="round"/>
</svg>
