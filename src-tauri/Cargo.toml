[package]
name = "atoll"
version = "0.2.15"
description = "Windows 桌面灵动岛悬浮组件"
authors = ["ZHANGCHAO"]
edition = "2021"

# Tauri 2 标准三件套 crate-type,保持官方脚手架默认值
[lib]
name = "atoll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 全屏检测用的 Win32 API(仅声明式 FFI 绑定,无运行时开销)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# 剪贴板模块:watcher 走 Win32 消息事件驱动,读写文本一体化
clipboard-rs = "0.3"

[profile.release]
# 常驻小组件,优先体积与启动速度
opt-level = "s"
lto = true
codegen-units = 1
strip = true
